name: Unit Test Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'backend/**'
      - 'frontend/**'

concurrency:
  group: unit-test-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  HEAD_REF: ${{ github.event.pull_request.head.ref }}

jobs:
  generate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      testable: ${{ steps.analysis.outputs.testable }}
      has_patch: ${{ steps.patch.outputs.has_patch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use scripts and agent definition from the base branch
        run: |
          git worktree add --detach "$RUNNER_TEMP/trusted" "$BASE_SHA"
          rm -rf .claude && git checkout "$BASE_SHA" -- .claude && git reset -q .claude
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Analyze changed files
        id: analysis
        env:
          ANALYSIS_FILE: .agent-output/analysis.json
        run: node "$RUNNER_TEMP/trusted/.github/scripts/analyze-pr.ts"
      - name: Install dependencies
        if: steps.analysis.outputs.testable != '0'
        run: |
          npm ci --prefix backend --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund
      - name: Install subprocess isolation dependencies
        if: steps.analysis.outputs.testable != '0'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run Unit Test Agent
        id: agent
        if: steps.analysis.outputs.testable != '0'
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          settings: .claude/unit-test-agent.settings.json
          display_report: 'false'
          prompt: |
            Mode: pr.
            Base commit: ${{ github.event.pull_request.base.sha }}
            Head commit: ${{ github.event.pull_request.head.sha }}
            Create or update unit tests for the changes between the base commit and HEAD, following
            your workflow. Verify with the run-tests skill and write .agent-output/report.json.
          claude_args: >-
            --agent unit-test-agent
            --permission-mode dontAsk
            --model ${{ vars.UNIT_TEST_AGENT_MODEL || 'sonnet' }}
            --max-turns 120
      - name: Export test patch
        id: patch
        if: always() && steps.agent.outcome != 'skipped'
        run: node "$RUNNER_TEMP/trusted/.github/scripts/export-patch.ts"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.analysis.outcome == 'success'
        with:
          name: agent-output
          path: |
            .agent-output/analysis.json
            .agent-output/tests.patch
            .agent-output/report.json
          if-no-files-found: ignore
          retention-days: 14

  verify:
    needs: generate
    if: needs.generate.outputs.has_patch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use scripts from the base branch
        run: git worktree add --detach "$RUNNER_TEMP/trusted" "$BASE_SHA"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-output
          path: ${{ runner.temp }}/agent-output
      - name: Apply the agent patch
        env:
          PATCH_FILE: ${{ runner.temp }}/agent-output/tests.patch
        run: node "$RUNNER_TEMP/trusted/.github/scripts/apply-patch.ts"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --prefix backend --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund
      - name: Typecheck, test and measure coverage
        env:
          RESULTS_FILE: ${{ runner.temp }}/test-results.json
        run: node "$RUNNER_TEMP/trusted/.github/scripts/verify-tests.ts"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results.json
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: [generate, verify]
    if: ${{ !cancelled() && needs.generate.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
      PUBLISH_STATE_FILE: ${{ github.workspace }}/publish-state.json
    steps:
      - name: Check out scripts from the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .claude/skills/report-results
      - name: Check out the pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          path: pr
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          path: artifacts
      - name: Commit verified tests
        id: commit
        working-directory: pr
        env:
          TESTABLE: ${{ needs.generate.outputs.testable }}
          HAS_PATCH: ${{ needs.generate.outputs.has_patch }}
          GENERATE_RESULT: ${{ needs.generate.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: node ../trusted/.github/scripts/commit-tests.ts
      - name: Publish PR comment and summary
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node trusted/.github/scripts/publish-comment.ts
      - name: Fail when tests were not accepted
        if: steps.commit.outputs.failed == 'true'
        run: exit 1
